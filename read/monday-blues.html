<h1>월요병 극복, 일요일 밤마다 가슴이 답답하다면</h1>

<p>일요일 오후 네다섯 시쯤부터 기분이 슬슬 가라앉습니다. 저녁을 먹고 나면 내일 할 일이 하나씩 떠오르고, 예능을 틀어놔도 눈에 안 들어와요. 누우면 잠은 안 오고, 겨우 잠들었다 깨면 벌써 월요일 아침입니다. 몸이 이불에 붙은 것처럼 무거워요.</p>

<p>다들 그렇다고 넘기기 쉽지만, 매주 반복되면 한 주의 이틀 가까이를 그렇게 보내는 셈입니다. 월요병은 게을러서 생기는 게 아니에요. 이유가 있고, 그 이유를 알면 조금씩 덜어낼 수 있습니다.</p>

<h2>월요병은 왜 생길까</h2>

<p><b>주말 동안 몸의 시계가 뒤로 밀려서예요.</b> 금요일과 토요일에 늦게 자고 늦게 일어나면, 몸은 해외여행이라도 다녀온 것처럼 시차가 생깁니다. 일요일 밤에 평소 시간에 누워도 몸은 아직 초저녁이라고 느껴요. 잠이 안 오는 게 당연합니다. 그렇게 잠을 설친 채 월요일 아침을 맞으니 더 무겁게 느껴지죠.</p>

<p><b>쉬는 날과 일하는 날의 온도 차가 커서예요.</b> 주말이 편할수록, 평일이 버거울수록 그 사이를 건너는 일요일 밤이 힘들어집니다. 월요일 자체보다 "다시 거기로 돌아가야 한다"는 예감이 더 무겁게 느껴지는 거예요.</p>

<p><b>일요일 저녁에 머리가 미리 출근해서예요.</b> 해야 할 일, 걸리는 사람, 마감이 한꺼번에 떠오르면 몸은 집에 있어도 마음은 이미 월요일 회의실에 앉아 있습니다. 실제로 일한 건 없는데 벌써 지친 기분이 들어요.</p>

<h2>이런 게 다 월요병 신호예요</h2>
<ul>
<li>일요일 오후부터 말수가 줄고 괜히 짜증이 난다</li>
<li>일요일 밤에 유난히 잠이 안 오거나 자꾸 깬다</li>
<li>월요일 아침 알람을 몇 번이나 끈다</li>
<li>월요일 오전엔 머리가 멍하고 집중이 안 된다</li>
<li>출근길에 속이 더부룩하거나 두통이 있다</li>
<li>화요일쯤 되면 언제 그랬냐는 듯 괜찮아진다</li>
</ul>
<p>마지막 항목이 중요합니다. 주 초반에만 힘들고 며칠 지나면 돌아온다면, 대부분은 생활 리듬과 마음가짐으로 줄일 수 있는 범위예요.</p>

<h2>주말을 이렇게 보내면 덜해요</h2>
<ol>
<li><b>일어나는 시간을 평일과 1시간 안쪽으로.</b> 늦게 자는 건 어느 정도 괜찮지만, 일어나는 시간이 크게 밀리면 일요일 밤이 망가집니다. 더 자고 싶으면 차라리 오후에 20~30분 낮잠으로 채우세요.</li>
<li><b>일요일 오후에 햇빛 보기.</b> 오후에 30분이라도 밖을 걸으면 몸의 시계가 제자리로 돌아오는 데 도움이 됩니다. 잠도 한결 수월하게 와요.</li>
<li><b>일요일 저녁에 작은 즐거움 하나 넣기.</b> 좋아하는 음식, 보고 싶던 영화 한 편처럼 일요일 저녁을 "끝나가는 시간"이 아니라 "기다려지는 시간"으로 바꾸는 겁니다.</li>
<li><b>금요일 퇴근 전에 월요일 할 일 세 줄 적어두기.</b> 주말 동안 머릿속에서 일이 맴도는 걸 막아줍니다. 월요일 아침에도 뭘 먼저 할지 고민하지 않아도 돼요.</li>
</ol>

<h2>일요일 밤, 생각이 많아질 때</h2>

<p>누웠는데 내일 일이 자꾸 떠오르면 억지로 떨쳐내려 할수록 더 붙습니다. 이럴 땐 오히려 꺼내놓는 편이 낫습니다.</p>
<ul>
<li><b>걱정을 종이에 적기.</b> "내일 팀장님한테 보고해야 함", "메일 답장 밀려 있음"처럼 떠오르는 대로 적고 덮어두세요. 머리가 "적어뒀으니 안 잊겠다"며 조금 내려놓습니다.</li>
<li><b>월요일 아침 첫 한 시간만 정해두기.</b> 한 주 전체를 떠올리면 막막하지만, 첫 한 시간만 정하면 할 만해 보여요.</li>
<li><b>월요일 점심이나 퇴근 후에 작은 약속 하나.</b> 좋아하는 메뉴든 친구와 통화든 월요일에도 기다릴 거리가 있으면 한결 가벼워집니다.</li>
</ul>
<p>밤마다 생각이 끊이지 않는 편이라면 <a href="https://dobbba.github.io/confesso-link/read/insomnia-night-thoughts.html">밤에 생각이 많아질 때</a> 글도 함께 보세요.</p>

<h2>그냥 월요병이 아닐 수도 있어요</h2>

<p>아래에 해당한다면 월요일의 문제라기보다 지금 하는 일이나 몸과 마음 상태를 한번 들여다볼 때입니다.</p>
<ul>
<li>화요일, 수요일이 돼도 무거운 기분이 풀리지 않는다</li>
<li>주말에도 쉬는 느낌이 전혀 안 들고 계속 지쳐 있다</li>
<li>출근 생각만 하면 숨이 막히거나 눈물이 난다</li>
<li>특정한 사람 때문에 회사 가는 게 무섭다</li>
<li>몇 주째 좋아하던 것도 재미가 없다</li>
</ul>
<p>한 주 내내 지쳐 있다면 <a href="https://dobbba.github.io/confesso-link/read/burnout-signs.html">번아웃 증상</a>을, 회사 사람 때문에 힘들다면 <a href="https://dobbba.github.io/confesso-link/read/workplace-bullying.html">직장 내 괴롭힘</a> 글을 참고해보세요. 이런 상태가 2주 넘게 이어지면 정신건강의학과나 상담센터에서 이야기를 나눠보는 것도 좋습니다.</p>
